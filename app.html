<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>古筝教学互动软件主控台</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/workspace.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <aside class="workspace-sidebar">
        <div class="sidebar-brand">
          <h1>古筝教学互动软件</h1>
          <a class="sidebar-back" href="./index.html">返回首页</a>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav" aria-label="教学模块导航"></nav>
      </aside>

      <main class="workspace-main">
        <header class="workspace-header">
          <div>
            <p class="eyebrow" id="header-eyebrow">Teaching Workspace</p>
            <h2 id="header-title">教学主控台</h2>
            <p class="workspace-header__summary" id="header-summary">从左侧选择教学模块，在右侧完成讲解与互动操作。</p>
          </div>
          <div class="workspace-header__actions" id="header-actions"></div>
        </header>

        <section class="workspace-content" id="workspace-content"></section>
      </main>
    </div>

    <div class="fullscreen-overlay" id="fullscreen-overlay" aria-hidden="true"></div>

    <script type="module" src="./scripts/app-shell.js"></script>
  </body>
</html>
